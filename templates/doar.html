<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fazer Doação - Mãos que Ajudam</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🌱 Mãos que Ajudam</h1>
        <p>Faça sua doação</p>
    </header>

    <main>

        <div class="card">

            <h2>💚 Quero Ajudar</h2>

            <p>
                Preencha os dados abaixo para registrar
                sua intenção de doação.
            </p>

            <form action="/doar" method="POST">

                <label for="nome">Nome:</label>
                <br>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <br>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail" required>

                <br><br>

                <label for="valor">Valor da doação:</label>
                <br>
                <input type="number" id="valor" name="valor"
                       placeholder="Ex.: 50.00"
                       min="1"
                       step="0.01"
                       required>

                <br><br>

                <label for="campanha">Campanha:</label>
                <br>

                <select id="campanha" name="campanha" required>

                    <option value="">
                        Selecione uma campanha
                    </option>

                    <option value="Alimentação">
                        🍲 Alimentação
                    </option>

                    <option value="Kits de Higiene">
                        🧼 Kits de Higiene
                    </option>

                </select>

                <br><br>

                <button type="submit" class="botao">
                    💚 Continuar
                </button>

            </form>

            <br>

            <a href="/campanhas" class="botao">
                ← Voltar para campanhas
            </a>

        </div>

    </main>

    <footer>
        <p>© 2026 Mãos que Ajudam</p>
    </footer>

</body>

</html>
